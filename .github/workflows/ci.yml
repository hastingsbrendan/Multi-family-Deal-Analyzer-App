name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    # Placeholders so modules that create the Supabase client can load; tests mock
    # the network and the CI build is never deployed (Cloudflare builds its own).
    env:
      VITE_SB_URL: https://ci-placeholder.supabase.co
      VITE_SB_ANON_KEY: ci-placeholder-anon-key
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      # Production dependencies only; dev tooling advisories don't ship to users
      - run: npm audit --omit=dev --audit-level=high
